name: lyrelog_ios
description: The iOS implementation of the lyrelog plugin, over the Lyrelog Swift SDK. Use the lyrelog package; this one comes with it.
version: 0.9.0
homepage: https://lyrelog.com
repository: https://github.com/lyrelog/lyrelog-flutter
issue_tracker: https://github.com/lyrelog/lyrelog-flutter/issues
documentation: https://docs.lyrelog.com/sdks/flutter

environment:
  # The oldest that works, checked with Flutter 3.44.0 (Dart 3.12): it is the first whose Swift
  # package plugins get the FlutterFramework package Package.swift depends on.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    implements: lyrelog
    platforms:
      ios:
        pluginClass: LyrelogIosPlugin
