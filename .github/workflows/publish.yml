# A v* tag publishes lyrelog_ios and then lyrelog to pub.dev, after the tests and the analyzer.
# The tag must match pubspec.yaml's version.
#
# No token: pub.dev trusts this repository's tags (each package's Admin page, "Automated
# publishing", tag pattern v{{version}}, environment "pub.dev"); setup-dart exchanges GitHub's
# OIDC token for pub's. lyrelog_ios goes first, from a copy outside the repository: the root
# .pubignore leaves its folder out of the lyrelog package, and pub would apply that to it too.
# The first versions were published by hand (a package must exist before it can trust a
# workflow).
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
      - name: The tag is the package's version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version: //p' pubspec.yaml)"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Already on pub.dev (a run repeated after lyrelog failed): skipped, so the run can go on.
      - name: Publish lyrelog_ios
        run: |
          version="$(sed -n 's/^version: //p' lyrelog_ios/pubspec.yaml)"
          if curl -sf "https://pub.dev/api/packages/lyrelog_ios/versions/$version" > /dev/null; then
            echo "lyrelog_ios $version is already on pub.dev"
            exit 0
          fi
          copy="$RUNNER_TEMP/lyrelog_ios"
          cp -R lyrelog_ios "$copy"
          cd "$copy" && flutter pub publish --force
      # pub.dev takes a little while to resolve the lyrelog_ios just published (v1.0.1's run
      # failed on it): try for up to five minutes.
      - name: Publish lyrelog
        run: |
          rm pubspec_overrides.yaml example/pubspec_overrides.yaml
          for attempt in $(seq 1 10); do
            flutter pub get && break
            echo "lyrelog_ios isn't resolvable yet: waiting 30 s"
            sleep 30
          done
          flutter pub publish --force
